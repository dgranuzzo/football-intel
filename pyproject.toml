[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-intel"
version = "0.1.0"
description = "Pipeline de estatisticas de futebol (Brasileirao, Libertadores, Champions) para Google Sheets e dashboards."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daniel Granuzzo" }]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0.1",
  "pandas>=2.2.0",
  "gspread>=6.1.0",
  "google-auth>=2.29.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.3",
  "rich>=13.7.0",
  "openpyxl>=3.1.2",
]

[project.scripts]
football-intel = "football_intel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
