name: daily-sync

on:
  schedule:
    - cron: "0 11 * * *"   # 08:00 America/Sao_Paulo (UTC-3)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run pipeline
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ACTIVE_LEAGUES: ${{ vars.ACTIVE_LEAGUES || 'BSA' }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: credentials/service_account.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SA_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SA_JSON }}' > credentials/service_account.json
          fi
          python -m football_intel sync
      - name: Commit warehouse CSVs
        run: |
          git config user.name "football-intel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/warehouse || true
          git diff --cached --quiet || git commit -m "chore: atualiza warehouse $(date -u +%F)"
          git push
